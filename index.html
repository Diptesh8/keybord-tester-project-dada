<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>keybord testing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

</head>

<body class=" flex flex-col items-center min-h-screen gap-2 bg-[url('./images/background.png')] bg-cover min-h-screen bg-center bg-no-repeat">
    <!--step1:- heading section   -->
    <div class="  gap-2">
        <h1 class="text-6xl font-extrabold mt-5 text-white flex justify-center mb-2">Keybord Tester</h1>
        <p class="text-2xl font-bold text-white">Free online keybord test to check if the keybord keys are working well or not</p>
    </div>
    <!-- step2:- keybord screen output section------- -->
    <div>
        <div class="w-[1000px] h-[200px] border-black bg-amber-200 rounded-2xl"></div>
    </div>
    <!-- step3:- keybord section--------- -->
    <div>
        <div class="w-[1000px] rounded-2xl bg-slate-900 p-6 shadow-2xl">

    <!-- Function Row -->
    <div class="flex items-center gap-3 mb-5">

        <button data-code="Escape"
            class="w-16 h-12 rounded-lg bg-slate-200 text-slate-800 font-medium shadow-[0_4px_0_#94a3b8]">
            Esc
        </button>

        <div class="w-5"></div>

        <button data-code="F1" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F1</button>
        <button data-code="F2" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F2</button>
        <button data-code="F3" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F3</button>
        <button data-code="F4" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F4</button>

        <div class="w-5"></div>

        <button data-code="F5" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F5</button>
        <button data-code="F6" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F6</button>
        <button data-code="F7" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F7</button>
        <button data-code="F8" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F8</button>

        <div class="w-5"></div>

        <button data-code="F9" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F9</button>
        <button data-code="F10" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F10</button>
        <button data-code="F11" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F11</button>
        <button data-code="F12" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800 shadow-[0_4px_0_#94a3b8]">F12</button>
    </div>


    <!-- Number Row -->
    <div class="flex gap-2 mb-3">

        <button data-code="Backquote" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">~</button>
        <button data-code="Digit1" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">1</button>
        <button data-code="Digit2" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">2</button>
        <button data-code="Digit3" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">3</button>
        <button data-code="Digit4" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">4</button>
        <button data-code="Digit5" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">5</button>
        <button data-code="Digit6" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">6</button>
        <button data-code="Digit7" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">7</button>
        <button data-code="Digit8" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">8</button>
        <button data-code="Digit9" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">9</button>
        <button data-code="Digit0" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">0</button>
        <button data-code="Minus" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">-</button>
        <button data-code="Equal" class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">=</button>

        <button data-code="Backspace"
            class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">
            Backspace
        </button>
    </div>


    <!-- QWERTY Row -->
    <div class="flex gap-2 mb-3">

        <button data-code="Tab"
            class="w-20 h-12 rounded-lg bg-slate-200 text-slate-800">
            Tab
        </button>

        <button data-code="KeyQ" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">Q</button>
        <button data-code="KeyW" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">W</button>
        <button data-code="KeyE" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">E</button>
        <button data-code="KeyR" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">R</button>
        <button data-code="KeyT" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">T</button>
        <button data-code="KeyY" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">Y</button>
        <button data-code="KeyU" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">U</button>
        <button data-code="KeyI" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">I</button>
        <button data-code="KeyO" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">O</button>
        <button data-code="KeyP" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">P</button>

        <button data-code="BracketLeft" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">[</button>
        <button data-code="BracketRight" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">]</button>
        <button data-code="Backslash" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">\</button>
    </div>


    <!-- Home Row -->
    <div class="flex gap-2 mb-3">

        <button data-code="CapsLock"
            class="w-24 h-12 rounded-lg bg-slate-200 text-slate-800">
            Caps Lock
        </button>

        <button data-code="KeyA" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">A</button>
        <button data-code="KeyS" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">S</button>
        <button data-code="KeyD" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">D</button>
        <button data-code="KeyF" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">F</button>
        <button data-code="KeyG" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">G</button>
        <button data-code="KeyH" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">H</button>
        <button data-code="KeyJ" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">J</button>
        <button data-code="KeyK" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">K</button>
        <button data-code="KeyL" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">L</button>

        <button data-code="Semicolon" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">;</button>
        <button data-code="Quote" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">'</button>

        <button data-code="Enter"
            class="w-24 h-12 rounded-lg bg-slate-200 text-slate-800">
            Enter
        </button>
    </div>


    <!-- Shift Row -->
    <div class="flex gap-2 mb-3">

        <button data-code="ShiftLeft"
            class="w-28 h-12 rounded-lg bg-slate-200 text-slate-800">
            Shift
        </button>

        <button data-code="KeyZ" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">Z</button>
        <button data-code="KeyX" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">X</button>
        <button data-code="KeyC" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">C</button>
        <button data-code="KeyV" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">V</button>
        <button data-code="KeyB" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">B</button>
        <button data-code="KeyN" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">N</button>
        <button data-code="KeyM" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">M</button>

        <button data-code="Comma" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">,</button>
        <button data-code="Period" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">.</button>
        <button data-code="Slash" class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">/</button>

        <button data-code="ShiftRight"
            class="w-28 h-12 rounded-lg bg-slate-200 text-slate-800">
            Shift
        </button>
    </div>


    <!-- Bottom Row -->
    <div class="flex gap-2">

        <button data-code="ControlLeft"
            class="w-20 h-12 rounded-lg bg-slate-200 text-slate-800">
            Ctrl
        </button>

        <button data-code="MetaLeft"
            class="w-20 h-12 rounded-lg bg-slate-200 text-slate-800">
            Win
        </button>

        <button data-code="AltLeft"
            class="w-20 h-12 rounded-lg bg-slate-200 text-slate-800">
            Alt
        </button>

        <button data-code="Space"
            class="flex-1 h-12 rounded-lg bg-slate-200 text-slate-800">
            Space
        </button>

        <button data-code="AltRight"
            class="w-20 h-12 rounded-lg bg-slate-200 text-slate-800">
            Alt
        </button>

        <button data-code="MetaRight"
            class="w-20 h-12 rounded-lg bg-slate-200 text-slate-800">
            Win
        </button>

        <button data-code="ContextMenu"
            class="w-20 h-12 rounded-lg bg-slate-200 text-slate-800">
            Menu
        </button>

        <button data-code="ControlRight"
            class="w-20 h-12 rounded-lg bg-slate-200 text-slate-800">
            Ctrl
        </button>

        <!-- Arrow Keys -->
        <div class="flex gap-2 ml-3">

            <div class="flex flex-col gap-2">
                <div class="h-6"></div>

                <button data-code="ArrowLeft"
                    class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">
                    ←
                </button>
            </div>

            <div class="flex flex-col gap-2">
                <button data-code="ArrowUp"
                    class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">
                    ↑
                </button>

                <button data-code="ArrowDown"
                    class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">
                    ↓
                </button>
            </div>

            <div class="flex flex-col gap-2">
                <div class="h-6"></div>

                <button data-code="ArrowRight"
                    class="w-12 h-12 rounded-lg bg-slate-200 text-slate-800">
                    →
                </button>
            </div>

        </div>

    </div>

</div>
    </div>


</body>

</html>
